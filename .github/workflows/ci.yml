name: CI
on: [push, pull_request]

env:
  DATABASE_URL: postgresql://referralradar:referralradar@localhost:5432/referralradar_test

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: referralradar
          POSTGRES_PASSWORD: referralradar
          POSTGRES_DB: referralradar_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Run migrations
        run: npx tsx src/db/migrate.ts
        env:
          NODE_ENV: test

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
